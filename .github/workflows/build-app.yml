# Builds the ORBIT desktop app installers for Windows, macOS and Linux.
# Runs on every push to the OrbitAI branch, on tags like v0.2.0, or from the Actions tab.
# The installers appear as downloadable artifacts on the workflow run.
name: Build ORBIT app

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [OrbitAI]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download on-device speech models
        run: npm run models
      - name: Browser for the dashboard test (Linux only)
        if: runner.os == 'Linux'
        run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Test
        run: npm test
      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Unsigned builds. Add signing certificates as secrets to remove OS warnings.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Launch the built app (smoke test)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) EXE="release/win-unpacked/ORBIT.exe"; RUN="" ;;
            macOS)   EXE="$(ls -d release/mac*/ORBIT.app)/Contents/MacOS/ORBIT"; RUN="" ;;
            Linux)   EXE="release/linux-unpacked/orbit"; RUN="xvfb-run -a"; EXTRA="--no-sandbox" ;;
          esac
          export ORBIT_SMOKE="$RUNNER_TEMP/smoke.json" ORBIT_USER_DATA="$RUNNER_TEMP/orbit-data"
          # perl alarm works as a timeout on Windows (Git Bash), macOS and Linux alike
          perl -e 'alarm shift; exec @ARGV' 120 $RUN "$EXE" $EXTRA || true
          cat "$ORBIT_SMOKE"; echo
          cat "$ORBIT_USER_DATA/orbit.log" || true
          grep -q '"ok":true' "$ORBIT_SMOKE"
      - uses: actions/upload-artifact@v4
        with:
          name: ORBIT-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
