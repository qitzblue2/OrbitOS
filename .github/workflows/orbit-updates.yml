# Orbit OS update server: builds the Orbit packages and Aphelion, signs them and publishes
# them as an APT repository on GitHub Pages (https://qitzblue2.github.io/OrbitOS/apt/).
# Installed Orbit systems pick them up through Software → Updates, orbit-update, or
# automatically (unattended-upgrades).
#
# One-time setup (see UPDATES.md): run tools/make-signing-key.sh, commit
# config/keys/orbit-archive.asc, add the secret ORBIT_SIGNING_KEY, and set
# Settings → Pages → Source to "GitHub Actions".
name: Orbit updates

on:
  push:
    branches: [claude/sleepy-hopper-bb4tau]
    paths: [packages/**, branding/**, icons/**, config/**, skel/**, tools/**, build.sh]
  schedule:
    - cron: "17 3 * * *"        # daily: picks up new Aphelion versions from the Orbit-Apps branch
  workflow_dispatch:

permissions:
  contents: write     # Aphelion's Windows installer is published as a GitHub release asset
  pages: write
  id-token: write

concurrency:
  group: orbit-updates
  cancel-in-progress: false

jobs:
  # Aphelion for Windows: built once per version and published as release aphelion-v<version>;
  # the build job below writes aphelion/windows/latest.json, which Aphelion's Update button reads.
  aphelion-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      built: ${{ steps.v.outputs.built }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Orbit-Apps
      - id: v
        working-directory: Orbit-Web
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "aphelion-v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "built=false" >> "$GITHUB_OUTPUT"; echo "Aphelion $v for Windows is already published"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.built == 'true'
        with:
          node-version: 22
      - name: Build the Windows installer
        if: steps.v.outputs.built == 'true'
        working-directory: Orbit-Web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run lists
          npm run bundle
          npx electron-builder --win nsis --x64 --publish never
          mv "dist/Aphelion Setup ${{ steps.v.outputs.version }}.exe" "dist/Aphelion-Setup-${{ steps.v.outputs.version }}.exe"
      - uses: actions/upload-artifact@v4
        if: steps.v.outputs.built == 'true'
        with:
          name: aphelion-windows
          path: Orbit-Web/dist/Aphelion-Setup-*.exe
          retention-days: 3

  build:
    needs: aphelion-windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Signing key present?
        env:
          ORBIT_SIGNING_KEY: ${{ secrets.ORBIT_SIGNING_KEY }}
        run: |
          if [ -z "$ORBIT_SIGNING_KEY" ] || [ ! -f config/keys/orbit-archive.asc ]; then
            echo "::error::No signing key yet. Run tools/make-signing-key.sh, commit config/keys/orbit-archive.asc and add the ORBIT_SIGNING_KEY secret (see UPDATES.md)."
            exit 1
          fi
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil python3-cairosvg librsvg2-bin libgtk-3-bin dpkg-dev libglib2.0-bin apt-utils gnupg
      - name: Orbit packages
        run: ORBIT_PKG_VERSION="2.0.0.${{ github.run_number }}" ./build.sh --debs-only
      - uses: actions/checkout@v4
        with:
          ref: Orbit-Apps
          path: aphelion-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aphelion
        working-directory: aphelion-src/Orbit-Web
        run: |
          npm ci --no-audit --no-fund
          npm run lists
          npm run bundle
          npx electron-builder --linux deb --x64 --publish never
          cp dist/aphelion_*_amd64.deb "$GITHUB_WORKSPACE/out/"
      - name: Check packages
        run: python3 tests/check_debs.py out
      - name: Sign and lay out the repository
        env:
          ORBIT_SIGNING_KEY: ${{ secrets.ORBIT_SIGNING_KEY }}
        run: |
          tools/publish-repo.sh out site
          printf '<!doctype html><meta charset="utf-8"><title>Orbit OS updates</title><p>Orbit OS update server. Turn updates on: <code>curl -fsSL https://qitzblue2.github.io/OrbitOS/setup.sh | sudo sh</code></p>\n' > site/index.html
      - uses: actions/download-artifact@v4
        if: needs.aphelion-windows.outputs.built == 'true'
        with:
          name: aphelion-windows
          path: win
      - name: Aphelion for Windows (release and update feed)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.aphelion-windows.outputs.version }}
        run: |
          tag="aphelion-v$V"; exe="Aphelion-Setup-$V.exe"
          if [ "${{ needs.aphelion-windows.outputs.built }}" = true ]; then
            gh release create "$tag" "win/$exe" --repo "$GITHUB_REPOSITORY" --target Orbit-Apps \
              --title "Aphelion $V for Windows" \
              --notes "Download $exe and run it. Aphelion updates itself from then on (Settings → About → Update now)."
          else
            mkdir -p win
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$exe" --dir win --clobber
          fi
          mkdir -p site/aphelion/windows
          size=$(stat -c %s "win/$exe"); sha=$(sha256sum "win/$exe" | cut -d' ' -f1)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$exe"
          printf '{"version":"%s","file":"%s","sha256":"%s","size":%s,"url":"%s"}\n' "$V" "$exe" "$sha" "$size" "$url" \
            > site/aphelion/windows/latest.json
          cat site/aphelion/windows/latest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
