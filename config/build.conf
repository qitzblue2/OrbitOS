# Orbit OS build configuration. Every value that affects the output is pinned here.
ORBIT_VERSION=1.0.0

# Base: official Ubuntu 24.04 LTS desktop ISO. SHA256SUMS is GPG-verified against
# the pinned Ubuntu CD image key, then the ISO is checked against SHA256SUMS
# and additionally against the hash pinned below.
UBUNTU_ISO=ubuntu-24.04.5.1-desktop-amd64.iso
UBUNTU_ISO_BASE=https://releases.ubuntu.com/24.04
UBUNTU_ISO_SHA256=4da4a0c9035da8e68a59a838674f403f0a54472c78a83b4fb7f78d03588f85a7
UBUNTU_CDIMAGE_KEY_FPR=843938DF228D22F7B3742BC0D94AA3F0EFE21092

# Package versions are pinned to one moment of the Ubuntu archive through
# snapshot.ubuntu.com (apt --snapshot). Bump deliberately to pick up updates;
# the installed system then follows the live archive + unattended-upgrades.
ORBIT_SNAPSHOT=20261020T000000Z

# Mozilla's signed APT repo provides firefox-esr as a .deb (Ubuntu ships Firefox as a snap).
MOZILLA_APT_KEY_FPR=35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3

BUILD_CONTAINER=ubuntu:24.04
HOST_DEPS="xorriso squashfs-tools gpg gpgv curl ca-certificates python3 python3-yaml python3-pil python3-cairosvg librsvg2-bin libgtk-3-bin dpkg-dev libglib2.0-bin"
