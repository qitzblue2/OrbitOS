# Optional TLP profile for the EliteBook 830 G7 (i5-1145G7). Not active by default.
# To use: sudo apt install tlp && sudo apt purge power-profiles-daemon &&
#         sudo cp /usr/share/orbit-os/tlp/orbit.conf /etc/tlp.d/90-orbit.conf && sudo tlp start
TLP_DEFAULT_MODE=BAT
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_BOOST_ON_BAT=0
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power
PCIE_ASPM_ON_BAT=powersupersave
RUNTIME_PM_ON_BAT=auto
WIFI_PWR_ON_BAT=on
USB_AUTOSUSPEND=1
# Keep the fingerprint reader awake so it answers PAM promptly.
# IDs are placeholders: replace with the reader ID from `lsusb` (tools/hardware-check.sh prints it).
USB_DENYLIST="06cb:00f0 138a:0097"
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=90
