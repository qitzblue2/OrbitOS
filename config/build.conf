# Orbit OS build configuration. Every value that affects the output is pinned here.
ORBIT_VERSION=2.0.0
ORBIT_CODENAME=perihelion

# Base: Debian 13 "trixie" (stable). The system is bootstrapped from Debian's own
# archive with mmdebstrap; no other distribution's image is used.
DEBIAN_SUITE=trixie

# Package versions are pinned to one moment of the Debian archive through
# snapshot.debian.org. Bump deliberately to pick up updates; the installed system
# follows the live archive (deb.debian.org + security) and installs security
# updates by itself.
ORBIT_SNAPSHOT=20261020T000000Z
DEBIAN_MIRROR="https://snapshot.debian.org/archive/debian/${ORBIT_SNAPSHOT}"
DEBIAN_SECURITY_MIRROR="https://snapshot.debian.org/archive/debian-security/${ORBIT_SNAPSHOT}"
DEBIAN_COMPONENTS="main contrib non-free-firmware"

# Aphelion (the Orbit browser, branch Orbit-Apps, folder Orbit-Web). The build uses
# ORBIT_APHELION_DEB=/path/to/aphelion_*.deb if set, else out/aphelion_*.deb, else it
# builds the package from the Orbit-Apps branch (needs Node.js 22 + npm on the host).
APHELION_BRANCH=Orbit-Apps

# Build host: a clean Debian 13 container (or ./build.sh --host on a Debian 13 /
# Ubuntu 24.04 machine with these tools).
BUILD_CONTAINER=debian:trixie
HOST_DEPS="mmdebstrap debian-archive-keyring squashfs-tools xorriso grub-pc-bin mtools initramfs-tools-core zstd dosfstools curl ca-certificates python3 python3-pil python3-cairosvg librsvg2-bin libgtk-3-bin dpkg-dev libglib2.0-bin git"
