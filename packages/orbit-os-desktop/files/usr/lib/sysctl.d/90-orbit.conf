# Orbit OS: desktop tuning. Swap is compressed RAM (zram) first, so swapping is cheap.
vm.swappiness = 150
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# keep file-system metadata cached: folders open faster
vm.vfs_cache_pressure = 50
# write back dirty pages in smaller batches: no long stalls when copying to USB sticks
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
# games (Proton, Star Citizen, Hogwarts Legacy …) need many memory maps
vm.max_map_count = 1048576
# editors, Files and sync tools watch many folders
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
# faster, fairer networking
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
kernel.nmi_watchdog = 0
